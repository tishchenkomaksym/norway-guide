# Локализация интерфейса.
#
# Базовый язык — русский: на нём написан код и на нём формулируются
# строки. Английский переводится сразу и служит запасным для языков,
# где перевода ещё нет.
#
# Не путать с языком контента: описания мест приходят из Wikipedia
# и живут в таблице translations со своей цепочкой подстановки (§8.4).
arb-dir: lib/l10n
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-class: L
nullable-getter: false
