org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Инкрементальная компиляция Kotlin отключена: на Windows она падает
# с «Could not close incremental caches» при сборке плагинов
# (url_launcher_android и другие). Причина — файловые блокировки,
# которые Kotlin-компилятор не снимает вовремя.
#
# Цена: полная пересборка Kotlin-кода плагинов на каждый билд, несколько
# лишних секунд. Своего Kotlin-кода в проекте нет, так что заметного
# замедления это не даёт.
kotlin.incremental=false
