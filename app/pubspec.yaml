name: nordguide
description: "Offline guide to Norway"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Состояние и DI. Экраны здесь — это функция (id, язык, фильтры) → запрос
  # к локальной БД, что ложится на family-провайдеры Riverpod без бойлерплейта.
  # Кодогенерация Riverpod не используется: riverpod_generator требует build ^2,
  # а drift_dev — build ^3, одновременно они не разрешаются. Провайдеры пишем руками.
  flutter_riverpod: ^2.6.1

  # Локальная БД. Контентная открывается read-only, пользовательская
  # подключается через ATTACH — см. CLAUDE.md.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Геолокация для экрана «Рядом со мной». Работает офлайн.
  geolocator: ^13.0.2

  intl: any
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

  # Скачивание региональных пакетов (Этап 3).
  #
  # http — сама загрузка; crypto — проверка SHA-256 перед распаковкой:
  # оборвавшийся файл внешне неотличим от целого, а распаковывать мусор
  # в папку с фотографиями нельзя. archive — распаковка zip; внутри пакетов
  # нет сжатия (JPEG уже сжат), так что это чистое копирование.
  http: ^1.2.2
  crypto: ^3.0.6
  archive: ^3.6.1

  # Тип соединения: автоматическая загрузка регионов разрешена только
  # по Wi-Fi. Турист в Норвегии чаще всего в роуминге, и списать у него
  # двадцать мегабайт без спроса — это реальные деньги и одна звезда
  # в сторе.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Каталог, а не файл: content.sqlite генерируется пайплайном и в git
    # не хранится (на всей Норвегии это десятки мегабайт). Объявление
    # каталога позволяет собрать приложение и без него — тогда подставятся
    # тестовые данные из seed_data.dart.
    #
    # Собрать базу: см. docs/development.md, «Сборка контента».
    - assets/db/
    # Фотографии под свободными лицензиями. Каждая обязана иметь запись
    # в lib/core/attribution.dart — это требование CC BY-SA, а не формальность.
    - assets/images/
    # Снимки мест и городов от cmd/media. Автор и лицензия хранятся
    # в таблице photos и показываются на карточке места.
    - assets/photos/
